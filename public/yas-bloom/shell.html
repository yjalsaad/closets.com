<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2731C">
<title>YAS Bloom | The Closets</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<!-- Lean shell for /yas-bloom and /ar/yas-bloom (see docs/showroom3d/BLOOM-LEAN-SHELL.md).
     The site's index.html is the HOME page (prerendered, 4 hero PNGs = 8.2 MB); this page carries none of that.
     Same Google Fonts as the home page's head (Alexandria + IBM Plex Sans Arabic), loaded without blocking the first paint. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
  /* Tokens are the showroom's loading backdrop (src/showroom3d/3d/palette.js: veil, brandBrown, brandOrange); this file has no access to the app's CSS variables. */
  :root { --veil: #f6efe4; --brown: #3e2020; --orange: #e68e40; }
  html, body { margin: 0; height: 100%; background: var(--veil); }
  #boot { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; text-align: center; color: var(--brown);
          font: 500 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Alexandria", "IBM Plex Sans Arabic", sans-serif; background: var(--veil); }
  #boot b { font-weight: 600; font-size: 20px; letter-spacing: .02em; }
  #boot i { display: block; width: min(240px, 56vw); height: 3px; border-radius: 3px; background: rgba(62, 32, 32, .14); overflow: hidden; }
  #boot i::after { content: ""; display: block; width: 40%; height: 100%; background: var(--orange); border-radius: 3px; animation: boot-slide 1.3s ease-in-out infinite; }
  @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #boot button { display: none; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--orange); background: transparent; color: var(--brown); font: inherit; font-weight: 600; cursor: pointer; }
  #boot.failed i { display: none; }
  #boot.failed button { display: inline-block; }
  @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; opacity: .6; } }
</style>
</head>
<body>
<noscript><p style="font:16px sans-serif;padding:24px;color:#3e2020">JavaScript is required to open the showroom.</p></noscript>
<div id="boot" role="status" aria-live="polite"><b id="boot-t">YAS Bloom</b><span id="boot-s">Preparing the showroom</span><i></i><button type="button" onclick="location.reload()" id="boot-b">Reload</button></div>
<div id="root"></div>
<script>
/* Language is chosen by the app from the URL path (/ar/yas-bloom = Arabic), exactly as before; this only localises the loading text until the app takes over. */
(function () {
  var ar = /^\/ar(\/|$)/i.test(location.pathname);
  if (ar) {
    document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; document.title = 'ياس بلوم | الخزائن';
    document.getElementById('boot-t').textContent = 'ياس بلوم'; document.getElementById('boot-s').textContent = 'نجهّز المعرض'; document.getElementById('boot-b').textContent = 'إعادة التحميل';
  }
  var boot = document.getElementById('boot'), root = document.getElementById('root');
  /* the app clears #root and mounts into it; once it has, drop the loading card (the app's own cream loading screen is already on top, so there is no flash) */
  try { new MutationObserver(function (m, o) { if (root.firstChild) { boot.remove(); o.disconnect(); } }).observe(root, { childList: true }); } catch (e) { /* the card stays under the app's own full-screen loader */ }
  window.__bloomFail = function () {
    var s = document.getElementById('boot-s'); if (!s) return;
    s.textContent = ar ? 'تعذّر تحميل المعرض. تحقّق من الاتصال ثم أعد التحميل.' : 'The showroom could not be loaded. Check the connection and reload.';
    boot.className = 'failed';
  };
})();
</script>
<!--BLOOM-ENTRY:BEGIN
  Generic fallback: works with ANY build (reads the CRA asset manifest at run time, never cached, then adds the entrypoints in order).
  scripts/bloom-shell.js (postbuild) replaces this whole block with the real hashed <link>/<script> tags, plus preloads of the showroom chunks.
-->
<script>
(function () {
  fetch('/asset-manifest.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (m) {
    (m.entrypoints || []).forEach(function (f) {
      var u = '/' + f.replace(/^\//, '');
      if (/\.css$/.test(f)) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); }
      else if (/\.js$/.test(f)) { var s = document.createElement('script'); s.src = u; s.async = false; s.onerror = window.__bloomFail; document.body.appendChild(s); }
    });
  }).catch(function () { window.__bloomFail(); });
})();
</script>
<!--BLOOM-ENTRY:END-->
</body>
</html>
