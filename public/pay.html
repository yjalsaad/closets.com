<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#EFF4F2"/>
<title>Secure payment — The Closets International</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    /* Light "Sea Breeze" — matches site Palette v3: sea-mist canvas, pine ink,
       coral CTA (--brand) with light-orange (--peach) accents. */
    --bg:#EFF4F2; --card:#FFFFFF; --card-2:#F4F9F7;
    --line:#DBE5E2; --line-2:#CBD8D4;
    --ink:#1B2A27; --ink-2:#3D4F4B; --ink-3:#6D7C77; --ink-4:#93A19C;
    --brand:#C65D2E; --brand-2:#E08A44; --brand-ink:#FFFFFF; --peach:#F2A566;
    --ok:#1F9E73; --radius:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:22px;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;
  }

  /* ── Ambient animated backdrop (soft, on light) ────────────────────────── */
  .aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aura b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.30;
          will-change:transform}
  .aura .b1{width:460px;height:460px;left:-140px;top:-120px;
            background:radial-gradient(circle at 30% 30%,#C65D2E,transparent 70%);
            animation:drift1 20s var(--ease) infinite alternate}
  .aura .b2{width:400px;height:400px;right:-120px;bottom:-100px;
            background:radial-gradient(circle at 60% 40%,#F2A566,transparent 70%);opacity:.32;
            animation:drift2 24s var(--ease) infinite alternate}
  .aura .b3{width:300px;height:300px;right:20%;top:-90px;
            background:radial-gradient(circle at 50% 50%,#E08A44,transparent 70%);opacity:.22;
            animation:drift3 18s var(--ease) infinite alternate}
  @keyframes drift1{to{transform:translate(60px,50px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-50px,-40px) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-30px,40px) scale(1.2)}}
  .grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
         background-image:radial-gradient(rgba(27,42,39,.03) 1px,transparent 1px);
         background-size:3px 3px}

  .shell{width:100%;max-width:418px;position:relative;z-index:1}

  /* ── Brand ─────────────────────────────────────────────────────────────── */
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;
         opacity:0;animation:rise .7s var(--ease-out) .05s forwards}
  .brand img{height:28px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(27,42,39,.14))}
  .brand span{font-size:9px;letter-spacing:.28em;color:var(--ink-3);text-transform:uppercase;font-weight:600}

  /* ── Card ──────────────────────────────────────────────────────────────── */
  .card{position:relative;border-radius:var(--radius);padding:28px 24px;
        background:linear-gradient(165deg,#FFFFFF,#F5FAF8);
        border:1px solid var(--line);
        box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 30px 60px -28px rgba(27,42,39,.22),
                   0 0 0 1px rgba(27,42,39,.03);
        -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
        opacity:0;animation:cardin .8s var(--ease-out) .12s forwards}
  /* hairline top light — faint peach */
  .card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(180deg,rgba(242,165,102,.45),rgba(242,165,102,0) 30%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude}
  @keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* staggered children */
  .rv{opacity:0;animation:rise .6s var(--ease-out) forwards}
  .d1{animation-delay:.28s}.d2{animation-delay:.36s}.d3{animation-delay:.44s}
  .d4{animation-delay:.52s}.d5{animation-delay:.60s}.d6{animation-delay:.68s}

  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.2em;
           color:var(--ink-3);text-transform:uppercase;font-weight:600;margin-bottom:16px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);
                box-shadow:0 0 0 0 rgba(198,93,46,.5);animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,93,46,.5)}70%{box-shadow:0 0 0 7px rgba(198,93,46,0)}100%{box-shadow:0 0 0 0 rgba(198,93,46,0)}}

  .amt{font-size:46px;font-weight:700;letter-spacing:-.035em;color:var(--ink);line-height:1;
       margin-bottom:9px;display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
  .amt .cur{font-size:19px;font-weight:600;color:var(--ink-3);letter-spacing:0}
  .amt .num{background:linear-gradient(180deg,#1B2A27,#41534E);-webkit-background-clip:text;
            background-clip:text;-webkit-text-fill-color:transparent}

  .sub{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:22px}
  .sub b{color:var(--ink);font-weight:600}
  .sub .pct{display:inline-flex;align-items:center;padding:1px 7px;border-radius:6px;
            background:rgba(198,93,46,.14);color:var(--brand);font-weight:700;font-size:12px}

  /* Deposit breakdown */
  .rows{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
        padding:14px 0;margin-bottom:22px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;padding:5px 0}
  .row .k{color:var(--ink-3)}
  .row .v{color:var(--ink-2);font-variant-numeric:tabular-nums}
  .row.now{margin-top:4px;padding-top:9px;border-top:1px dashed var(--line-2)}
  .row.now .k{color:var(--ink);font-weight:600}
  .row.now .v{color:var(--ink);font-weight:700}

  /* Method chips */
  .methods{display:flex;gap:8px;margin-bottom:20px}
  .m{flex:1;position:relative;background:var(--card-2);border:1px solid var(--line-2);
     border-radius:11px;padding:12px 4px 10px;text-align:center;font-size:10px;font-weight:600;
     color:var(--ink-2);letter-spacing:.01em;overflow:hidden;cursor:default;
     transition:transform .25s var(--ease-out),border-color .25s,background .25s,box-shadow .25s}
  .m svg{display:block;margin:0 auto 6px;height:16px;width:auto}
  .m::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(198,93,46,.06) 50%,transparent 70%);
            transform:translateX(-120%);transition:transform .6s var(--ease)}
  .m:hover{transform:translateY(-3px);border-color:rgba(198,93,46,.45);
           background:linear-gradient(180deg,rgba(242,165,102,.16),var(--card-2));
           box-shadow:0 10px 22px -12px rgba(198,93,46,.4)}
  .m:hover::after{transform:translateX(120%)}

  /* Pay button */
  button.pay{position:relative;width:100%;padding:17px;border:none;border-radius:14px;
             background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;
             font:700 15px Inter,sans-serif;cursor:pointer;letter-spacing:.01em;overflow:hidden;
             box-shadow:0 12px 26px -10px rgba(198,93,46,.55),0 1px 0 rgba(255,255,255,.35) inset;
             transition:transform .12s var(--ease-out),box-shadow .25s,filter .2s}
  button.pay .lbl{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px}
  button.pay .shine{position:absolute;top:0;left:0;height:100%;width:60%;z-index:1;
                    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
                    transform:translateX(-160%) skewX(-18deg);animation:shine 3.4s ease-in-out 1.2s infinite}
  @keyframes shine{0%{transform:translateX(-160%) skewX(-18deg)}45%,100%{transform:translateX(260%) skewX(-18deg)}}
  button.pay:hover:not(:disabled){transform:translateY(-2px);
        box-shadow:0 18px 38px -12px rgba(198,93,46,.65),0 1px 0 rgba(255,255,255,.4) inset}
  button.pay:active:not(:disabled){transform:translateY(0) scale(.99)}
  button.pay:disabled{cursor:progress;filter:saturate(.7) brightness(.98)}
  button.pay:disabled .shine{animation:none;display:none}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;
           border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .alt{width:100%;margin-top:10px;padding:13px;border:1px solid var(--line-2);border-radius:12px;
       background:transparent;color:var(--ink-2);font:600 13px Inter,sans-serif;cursor:pointer;
       transition:background .2s,color .2s,border-color .2s}
  .alt:hover{background:var(--card-2);color:var(--ink);border-color:var(--line-2)}

  .trust{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;
         font-size:10.5px;color:var(--ink-4);line-height:1.4}
  .trust svg{width:12px;height:12px;flex-shrink:0;color:var(--ink-3)}

  .err{background:linear-gradient(180deg,rgba(212,64,52,.10),rgba(212,64,52,.05));
       border:1px solid rgba(212,64,52,.30);color:#B23A2E;border-radius:12px;
       padding:14px;font-size:12.5px;line-height:1.6;margin-bottom:16px}

  /* Paid state */
  .paid-ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 2px}
  .paid-ok .ring{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
                 background:rgba(31,158,115,.10);border:1px solid rgba(31,158,115,.38);margin-bottom:14px;
                 animation:pop .5s var(--ease-out)}
  .paid-ok svg{width:28px;height:28px;color:var(--ok)}
  .paid-ok .ck{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .6s var(--ease-out) .15s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .paid-ok h3{margin:0 0 5px;font-size:16px;font-weight:700;color:var(--ink)}
  .paid-ok p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.6}

  /* Skeleton */
  .skel{height:14px;border-radius:6px;margin-bottom:12px;position:relative;overflow:hidden;
        background:var(--card-2)}
  .skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(27,42,39,.05),transparent);
    animation:sweep 1.3s ease-in-out infinite}
  @keyframes sweep{to{transform:translateX(100%)}}

  .foot{text-align:center;margin-top:20px;font-size:10px;color:var(--ink-4);line-height:1.7;
        opacity:0;animation:rise .7s var(--ease-out) .5s forwards}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.05s!important}
    .aura b{animation:none}
  }
</style>
</head>
<body>
<div class="aura"><b class="b1"></b><b class="b2"></b><b class="b3"></b></div>
<div class="grain"></div>

<div class="shell">
  <div class="brand">
    <img src="/the-closets-logo.png" alt=""/>
    <span>The Closets International</span>
  </div>
  <div class="card" id="card">
    <div class="skel" style="width:38%"></div>
    <div class="skel" style="width:66%;height:36px;margin-bottom:16px"></div>
    <div class="skel" style="width:54%"></div>
    <div class="skel" style="width:100%;height:44px;margin-top:20px"></div>
  </div>
  <div class="foot">THE CLOSETS INTERNATIONAL W.L.L. &middot; +973 3611 1004</div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   SECURE PAYMENT PAGE

   /pay.html?kind=quotation|invoice|store_order|gift_voucher&ref=<id>

   Two densities, one language:
     · FULL    — a deposit with a balance to follow. Shows the split, because a
                 customer handing over BD 3,850 of BD 7,700 needs to see why.
     · EXPRESS — paid in full (everything under BD 500, per the agreement).

   This page NEVER decides the price. It asks the server (preview mode), and the
   server reads it from the database. Editing anything here changes nothing.
   ───────────────────────────────────────────────────────────────────────────── */
var SUPA_URL = "https://jflmbfxbhpioyniibjsj.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmbG1iZnhiaHBpb3luaWlianNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjkyNjQsImV4cCI6MjA5MDQ0NTI2NH0.XnQHF1Ivzhv6Zj12qe1Gh2x6ZyLdFfmUBweE_5SZnu0";

var Q    = new URLSearchParams(location.search);
var KIND = Q.get("kind") || "";
var REF  = Q.get("ref")  || "";
var LANG = Q.get("lang") === "ar" ? "ar" : "en";

var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">'
         + '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

/* Payment-method glyphs (inline, monochrome — kept generic). */
var MG = {
  visa:'<svg viewBox="0 0 48 16" height="14"><text x="0" y="13" font-family="Inter,sans-serif" font-size="15" font-weight="800" font-style="italic" fill="#6D7C77">VISA</text></svg>',
  mc:'<svg viewBox="0 0 30 20" height="16"><circle cx="11" cy="10" r="8" fill="#6D7C77" opacity=".85"/><circle cx="19" cy="10" r="8" fill="#9AA8A3" opacity=".7"/></svg>',
  benefit:'<svg viewBox="0 0 24 24" height="15" fill="none" stroke="#6D7C77" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>',
  apple:'<svg viewBox="0 0 24 24" height="16" fill="#6D7C77"><path d="M16.4 12.9c0-2 1.6-2.9 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7c-1.3 0-2.6.8-3.2 2-1.4 2.4-.4 5.9 1 7.9.6.9 1.4 2 2.4 2 .9 0 1.3-.6 2.4-.6s1.4.6 2.4.6 1.7-.9 2.3-1.8c.7-1 1-2 1-2-.1 0-2-.7-1.9-3.2zM14.6 6.3c.5-.6.9-1.5.8-2.3-.8 0-1.7.5-2.2 1.1-.5.5-.9 1.4-.8 2.2.9.1 1.8-.4 2.2-1z"/></svg>'
};

function bd(n){
  return Number(n||0).toLocaleString("en-BH",{minimumFractionDigits:3,maximumFractionDigits:3});
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];
  });
}
function api(body){
  return fetch(SUPA_URL + "/functions/v1/mf-pay", {
    method:"POST",
    headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().catch(function(){ return null; }); })
    .catch(function(){ return null; });
}

/* Animated count-up for the headline amount. Honors reduced-motion. */
function countUp(el, target){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  target = Number(target||0);
  if (reduce || target <= 0){ el.textContent = bd(target); return; }
  var start = null, dur = 850;
  function step(ts){
    if (start === null) start = ts;
    var p = Math.min((ts - start)/dur, 1);
    var e = 1 - Math.pow(1 - p, 3);            // easeOutCubic
    el.textContent = bd(target * e);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = bd(target);
  }
  requestAnimationFrame(step);
}

function fail(msg, retry){
  document.getElementById("card").innerHTML =
    '<div class="err" style="animation:rise .5s var(--ease-out) forwards">' + esc(msg) + '</div>' +
    (retry ? '<button class="alt" onclick="location.reload()">Try again</button>' : '') +
    '<button class="alt" onclick="location.href=\'/\'">Back to the site</button>';
}

function paid(){
  document.getElementById("card").innerHTML =
    '<div class="paid-ok">' +
      '<div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<path class="ck" d="M5 13l4 4L19 7"/></svg></div>' +
      '<h3>Already paid</h3>' +
      '<p>Thank you — nothing more is due on this order.</p>' +
    '</div>' +
    '<button class="alt" style="margin-top:20px" onclick="location.href=\'/\'">Back to the site</button>';
}

/* PAY_FULL is only ever offered on a deposit. It is a customer choice, not a
   price change — the server still decides what "full" means. */
var payFull = false;

function render(d){
  var express = Number(d.balance_later) <= 0;   // nothing left to pay later
  var el = document.getElementById("card");

  var head =
    '<div class="eyebrow rv d1"><span class="dot"></span>'
    + (express ? 'Secure payment' : 'Deposit &middot; secure payment') + '</div>';

  var amount =
    '<div class="amt rv d2"><span class="cur">BD</span><span class="num" id="amtNum">0.000</span></div>';

  var sub = express
    ? '<div class="sub rv d3">' + esc(d.label) + '</div>'
    : '<div class="sub rv d3">Paying <span class="pct">' + (Math.round(d.amount / d.total * 100)) + '%</span> of '
      + esc(d.label) + ' now, exactly as set out in your agreement.</div>';

  var rows = express ? '' :
    '<div class="rows rv d3">' +
      '<div class="row"><span class="k">Total</span><span class="v">BD ' + bd(d.total) + '</span></div>' +
      '<div class="row"><span class="k">Balance on delivery</span><span class="v">BD ' + bd(d.balance_later) + '</span></div>' +
      '<div class="row now"><span class="k">Due today</span><span class="v">BD ' + bd(d.amount) + '</span></div>' +
    '</div>';

  var methods =
    '<div class="methods rv d4">' +
      '<div class="m">' + MG.visa    + 'Visa</div>' +
      '<div class="m">' + MG.mc      + 'Mastercard</div>' +
      '<div class="m">' + MG.benefit + 'Benefit</div>' +
      '<div class="m">' + MG.apple   + 'Apple&nbsp;Pay</div>' +
    '</div>';

  var cta =
    '<button class="pay rv d5" id="go"><span class="shine"></span>' +
      '<span class="lbl">Pay BD ' + bd(d.amount) + '</span></button>' +
    (express ? '' :
      '<button class="alt rv d5" id="full">Pay the full BD ' + bd(d.total) + ' instead</button>');

  var trust =
    '<div class="trust rv d6">' + LOCK +
    '<span>Encrypted and processed by MyFatoorah. We never see your card.</span></div>';

  el.innerHTML = head + amount + sub + rows + methods + cta + trust;

  countUp(document.getElementById("amtNum"), d.amount);

  document.getElementById("go").onclick = go;
  var f = document.getElementById("full");
  if (f) f.onclick = function(){ payFull = true; go(); };
}

async function go(){
  var b = document.getElementById("go");
  b.disabled = true;
  b.querySelector(".lbl").innerHTML = '<span class="spinner"></span>Opening secure checkout…';

  var d = await api({ kind:KIND, ref_id:REF, pay_full:payFull, lang:LANG, origin:location.origin });

  if (d && d.ok && d.url) { location.href = d.url; return; }   /* hand over to MyFatoorah */
  fail((d && d.error) || "We could not open the payment page. Please try again.", true);
}

(async function(){
  if (!KIND || !REF) { fail("This payment link is incomplete. Please use the link we sent you.", false); return; }

  var d = await api({ kind:KIND, ref_id:REF, preview:true, lang:LANG });

  if (!d)                 { fail("We could not reach the payment service. Please check your connection.", true); return; }
  if (d.already_paid)     { paid(); return; }
  if (!d.ok)              { fail(d.error || "This payment link is no longer valid.", false); return; }

  render(d);
})();
</script>
</body>
</html>
