# Builds the website for the-closets.com and uploads it to SmarterASP.NET over FTP.
# Runs ONLY when started by hand (Actions > Deploy to SmarterASP.NET > Run workflow). Vercel deployments are not affected.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (SmarterASP panel > FTP).
name: Deploy to SmarterASP.NET
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Address the site will be served from (used for links, sitemap and sharing tags)
        default: https://the-closets.com
        required: true
      server_dir:
        description: Folder on the FTP server (the site root; must end with /). The FTP login opens the whole account, so never use ./
        default: /THE-CLOSETS/
        required: true
permissions:
  contents: read
concurrency: deploy-smarterasp
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (fails if the pages cannot be prerendered)
        run: npm run build:iis
        env:
          SITE_URL: ${{ inputs.site_url }}
          PRERENDER_REQUIRED: '1'
      # lftp, not a JavaScript FTP client: the server resets the encrypted data connection unless the client reuses
      # the TLS session, which lftp does. Nothing on the server is deleted; files are added or replaced.
      - name: Upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ inputs.server_dir }}
        run: |
          case "$SERVER_DIR" in *[!A-Za-z0-9/_.-]*) echo "server_dir may only use letters, digits, / _ . -"; exit 1 ;; /?*/) ;; *) echo "server_dir must look like /FOLDER/ (got: $SERVER_DIR)"; exit 1 ;; esac
          sudo apt-get install -y -qq lftp >/dev/null
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set ftp:passive-mode true; set net:timeout 30; set net:max-retries 5; set net:reconnect-interval-base 5;
            mirror --reverse --parallel=4 --no-perms --verbose=1 ./build/ $SERVER_DIR;
            bye"
